name: Build owner portrait

on:
  push:
    branches: [main]
    paths:
      - '.asset-build900-final/**'
      - '.github/workflows/build-owner-portrait.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify JPEG
        shell: bash
        run: |
          set -euo pipefail
          cat .asset-build900-final/part*.txt > /tmp/portrait.b64
          base64 --decode /tmp/portrait.b64 > travis-owner-portrait-900.jpg
          test "$(wc -c < travis-owner-portrait-900.jpg)" -eq 83769
          echo "484d9d87efe627af9977b2836fdf65b5fc77c1065d856cec35b0a571d8b007b7  travis-owner-portrait-900.jpg" | sha256sum --check -
          file travis-owner-portrait-900.jpg

      - name: Commit verified portrait
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add travis-owner-portrait-900.jpg
          if git diff --cached --quiet; then
            echo "Verified portrait already current."
            exit 0
          fi
          git commit -m "Build verified full-resolution owner portrait"
          git push
