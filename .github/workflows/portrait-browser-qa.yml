name: Portrait Browser Compatibility QA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  portrait-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright browsers
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install chromium firefox webkit --with-deps >/dev/null 2>&1

      - name: Verify portrait on major browser engines
        shell: bash
        run: |
          cat > portrait-qa.js <<'NODE'
          const { chromium, firefox, webkit } = require('playwright');

          (async () => {
            const url = 'https://gittyyuppenterprises.github.io/travis-sweeter-office-cleaning/';
            const engines = { chromium, firefox, webkit };
            const widths = [390, 1440];

            for (const [name, engine] of Object.entries(engines)) {
              const browser = await engine.launch({headless:true});
              for (const width of widths) {
                const page = await browser.newPage({ viewport: { width, height: 1000 } });
                await page.goto(url, { waitUntil: 'networkidle', timeout: 45000 });
                const img = page.locator('.owner-photo');
                await img.scrollIntoViewIfNeeded();
                await page.waitForTimeout(500);
                const state = await img.evaluate(el => ({
                  complete: el.complete,
                  naturalWidth: el.naturalWidth,
                  naturalHeight: el.naturalHeight,
                  renderedWidth: el.getBoundingClientRect().width,
                  renderedHeight: el.getBoundingClientRect().height,
                  srcPrefix: el.currentSrc.slice(0, 30),
                  overflow: document.documentElement.scrollWidth > window.innerWidth + 1
                }));
                console.log(name, width, JSON.stringify(state));
                if (!state.complete) throw new Error(name+' '+width+': image not complete');
                if (state.naturalWidth < 200 || state.naturalHeight < 250) throw new Error(name+' '+width+': portrait did not decode');
                if (state.renderedWidth < 150 || state.renderedHeight < 180) throw new Error(name+' '+width+': portrait rendered too small');
                if (!state.srcPrefix.startsWith('data:image/jpeg;base64,')) throw new Error(name+' '+width+': unexpected portrait source');
                if (state.overflow) throw new Error(name+' '+width+': horizontal overflow');
                await page.close();
              }
              await browser.close();
            }
            console.log('PORTRAIT COMPATIBILITY QA PASSED');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          node portrait-qa.js
